name: A-SCOPE F10 Real Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ascope-f10-real-smoke.yml
      - src/ashare_f10/ascope_bridge/**
      - src/ashare_f10/normalize/facts.py
      - scripts/run_resilient_fetch.py
      - tests/test_ascope_f10_*.py
      - tests/test_normalize_available_at.py
  workflow_dispatch:
    inputs:
      source_url:
        description: Immutable A-SCOPE financial-request ZIP
        required: true
        default: https://github.com/BullbaseGuy/a-scope-reearch/releases/download/ascope-financial-requests-2026-07-30-v1/ascope-financial-requests-2026-07-30-v1.zip
        type: string
      as_of_date:
        description: Research cutoff date
        required: true
        default: '2026-07-30'
        type: string

permissions:
  contents: read

concurrency:
  group: ascope-f10-real-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  SOURCE_URL: ${{ github.event_name == 'pull_request' && 'https://github.com/BullbaseGuy/a-scope-reearch/releases/download/ascope-financial-requests-2026-07-30-v1/ascope-financial-requests-2026-07-30-v1.zip' || inputs.source_url }}
  AS_OF_DATE: ${{ github.event_name == 'pull_request' && '2026-07-30' || inputs.as_of_date }}
  BATCH_ID: B001
  SMOKE_COUNT: '5'
  OUTPUT_ROOT: 09_OUTPUTS/ascope-f10-real-smoke

jobs:
  real-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python with dependency cache
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Validate fixed production input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_URL" == 'https://github.com/BullbaseGuy/a-scope-reearch/releases/download/ascope-financial-requests-2026-07-30-v1/ascope-financial-requests-2026-07-30-v1.zip' ]]
          [[ "$AS_OF_DATE" == '2026-07-30' ]]

      - name: Download immutable request snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf 09_OUTPUTS/ascope-request-real
          mkdir -p 09_OUTPUTS/ascope-request-real
          curl --fail --location --retry 2 --retry-delay 5 \
            --output 09_OUTPUTS/ascope-request-real/request.zip "$SOURCE_URL"

      - name: Execute real B001 first-five smoke and preserve exit code
        id: execute
        shell: bash
        run: |
          set +e
          python -m ashare_f10.ascope_bridge.cli run-batch \
            09_OUTPUTS/ascope-request-real/request.zip \
            --batch-id "$BATCH_ID" \
            --as-of-date "$AS_OF_DATE" \
            --smoke-count "$SMOKE_COUNT" \
            --data-root data \
            --output-root "$OUTPUT_ROOT" \
            --stock-workers 2 \
            --max-attempts 2 \
            --soft-deadline-seconds 18000 \
            --heartbeat-seconds 30
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate production boundary and smoke acceptance
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['OUTPUT_ROOT']) / os.environ['BATCH_ID']
          batch = json.loads((root / 'batch_manifest.json').read_text(encoding='utf-8'))
          validation = json.loads((root / 'validation_report.json').read_text(encoding='utf-8'))
          if batch.get('fixture_mode') or batch.get('non_investment_output'):
              raise SystemExit('real smoke output contains fixture/non-investment markers')
          if validation.get('status') not in {'PASS', 'PASS_WITH_GAPS'}:
              raise SystemExit(f"real smoke status is not acceptable: {validation.get('status')!r}")
          expected = {
              'input_count': 5,
              'successful_count': 5,
              'failed_count': 0,
              'deferred_count': 0,
              'future_rows': 0,
              'duplicate_resolution_rows': 0,
              'conservation_pass': True,
          }
          for key, value in expected.items():
              if validation.get(key) != value:
                  raise SystemExit(
                      f'real smoke acceptance mismatch: {key}={validation.get(key)!r}, expected {value!r}'
                  )
          for key in ('annual_rows', 'quarterly_rows', 'field_status_rows'):
              if int(validation.get(key) or 0) <= 0:
                  raise SystemExit(f'real smoke produced no canonical {key}: {validation.get(key)!r}')

      - name: Upload immutable real-smoke output and checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ascope-f10-real-smoke-B001-5-${{ github.run_id }}
          path: |
            09_OUTPUTS/ascope-request-real
            09_OUTPUTS/ascope-f10-real-smoke/B001
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: true

      - name: Propagate batch result after checkpoint upload
        if: always()
        shell: bash
        run: |
          code='${{ steps.execute.outputs.exit_code }}'
          [[ "$code" =~ ^[0-9]+$ ]]
          if [[ "$code" != '0' ]]; then
            echo "Real smoke returned exit code $code after its checkpoint was uploaded." >&2
            exit "$code"
          fi
