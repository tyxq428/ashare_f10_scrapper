name: A-SCOPE F10 Rollout Monitor

on:
  push:
    branches:
      - runtime/ascope-f10-rollout-monitor-20260803
    paths:
      - .github/workflows/ascope-f10-rollout-monitor.yml
      - runtime/ascope-f10-rollout-monitor-trigger.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: ascope-f10-rollout-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect exact canonical rollout and persist checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: '71'
          SOURCE_RUN_ID: '30782791016'
          EXPECTED_HEAD_SHA: a47c6ba5eb5a89a8bbdbf2e0ee58cf247b61b4c3
        shell: python
        run: |
          from __future__ import annotations

          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ['GH_TOKEN']
          repository = os.environ['REPOSITORY']
          issue_number = os.environ['ISSUE_NUMBER']
          source_run_id = int(os.environ['SOURCE_RUN_ID'])
          expected_head_sha = os.environ['EXPECTED_HEAD_SHA']
          api = 'https://api.github.com'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ascope-f10-rollout-monitor',
          }

          def request_json(method: str, path: str, payload: dict | None = None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode('utf-8')
              request = urllib.request.Request(
                  f'{api}{path}',
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.loads(response.read().decode('utf-8'))

          run = request_json(
              'GET',
              f'/repos/{repository}/actions/runs/{source_run_id}',
          )
          jobs = request_json(
              'GET',
              f'/repos/{repository}/actions/runs/{source_run_id}/jobs?per_page=100',
          ).get('jobs', [])
          artifacts = request_json(
              'GET',
              f'/repos/{repository}/actions/runs/{source_run_id}/artifacts?per_page=100',
          ).get('artifacts', [])

          now = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace('+00:00', 'Z')
          )
          identity_ok = (
              int(run.get('id') or 0) == source_run_id
              and run.get('name') == 'A-SCOPE F10 Recover B001 and Continue Rollout'
              and run.get('event') == 'push'
              and run.get('head_branch') == 'main'
              and run.get('head_sha') == expected_head_sha
          )

          job_lines = []
          for job in jobs:
              steps = job.get('steps') or []
              active = [
                  step.get('name')
                  for step in steps
                  if step.get('status') == 'in_progress'
              ]
              pending = sum(
                  1 for step in steps if step.get('status') in {'queued', 'pending'}
              )
              detail = []
              if active:
                  detail.append('active=' + ', '.join(str(item) for item in active))
              if pending:
                  detail.append(f'pending_steps={pending}')
              suffix = '; ' + '; '.join(detail) if detail else ''
              job_lines.append(
                  f"- `{job.get('name')}`: `{job.get('status')}` / "
                  f"`{job.get('conclusion') or 'PENDING'}`; "
                  f"started=`{job.get('started_at') or 'unknown'}`; "
                  f"completed=`{job.get('completed_at') or 'PENDING'}`{suffix}"
              )
          if not job_lines:
              job_lines.append('- no jobs returned')

          artifact_lines = [
              f"- `{artifact.get('name')}` "
              f"({artifact.get('size_in_bytes', 0)} bytes; "
              f"created=`{artifact.get('created_at') or 'unknown'}`)"
              for artifact in artifacts
          ]
          if not artifact_lines:
              artifact_lines.append('- none yet')

          body = '\n'.join([
              '## A-SCOPE exact canonical rollout checkpoint',
              '',
              f'- observed_at_utc: `{now}`',
              f'- identity_gate: `{"PASS" if identity_ok else "FAIL"}`',
              f'- run_id: `{run.get("id")}`',
              f'- run_number: `{run.get("run_number")}`',
              f'- run_attempt: `{run.get("run_attempt")}`',
              f'- status: `{run.get("status")}`',
              f'- conclusion: `{run.get("conclusion") or "PENDING"}`',
              f'- head_branch: `{run.get("head_branch")}`',
              f'- head_sha: `{run.get("head_sha")}`',
              f'- event: `{run.get("event")}`',
              f'- created_at: `{run.get("created_at")}`',
              f'- updated_at: `{run.get("updated_at")}`',
              f'- run_url: {run.get("html_url")}',
              f'- returned_jobs: `{len(jobs)}`',
              f'- returned_artifacts: `{len(artifacts)}`',
              '',
              '### Jobs',
              *job_lines,
              '',
              '### Artifacts',
              *artifact_lines,
              '',
              'The monitor used the exact canonical run ID and was read-only for Actions. It did not cancel, rerun, or dispatch any production job.',
          ])

          request_json(
              'POST',
              f'/repos/{repository}/issues/{issue_number}/comments',
              {'body': body},
          )
          print(body)

          if not identity_ok:
              raise SystemExit('canonical source identity gate failed')
