name: A-SCOPE F10 Rollout Monitor

on:
  push:
    branches:
      - runtime/ascope-f10-rollout-monitor-20260803
    paths:
      - .github/workflows/ascope-f10-rollout-monitor.yml
      - runtime/ascope-f10-rollout-monitor-trigger.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: ascope-f10-rollout-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect exact main recovery rollout and persist checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: '71'
          WORKFLOW_FILE: ascope-f10-b001-recovery.yml
        shell: python
        run: |
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ['GH_TOKEN']
          repository = os.environ['REPOSITORY']
          issue_number = os.environ['ISSUE_NUMBER']
          workflow_file = os.environ['WORKFLOW_FILE']
          api = 'https://api.github.com'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ascope-f10-rollout-monitor',
          }

          def request_json(method: str, path: str, payload: dict | None = None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode('utf-8')
              request = urllib.request.Request(
                  f'{api}{path}',
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.loads(response.read().decode('utf-8'))

          query = urllib.parse.urlencode({
              'branch': 'main',
              'event': 'push',
              'per_page': 20,
          })
          runs = request_json(
              'GET',
              f'/repos/{repository}/actions/workflows/{workflow_file}/runs?{query}',
          ).get('workflow_runs', [])
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')

          if not runs:
              body = (
                  '## A-SCOPE rollout monitor checkpoint\n\n'
                  f'- observed_at_utc: `{now}`\n'
                  '- status: `RUN_NOT_FOUND`\n'
                  f'- workflow: `{workflow_file}`\n'
                  '- branch/event: `main / push`\n\n'
                  'No matching exact-main recovery run was returned. This monitor made no mutation to the production workflow.'
              )
          else:
              run = sorted(runs, key=lambda item: item.get('created_at', ''), reverse=True)[0]
              run_id = int(run['id'])
              jobs_payload = request_json(
                  'GET',
                  f'/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100',
              )
              artifacts_payload = request_json(
                  'GET',
                  f'/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100',
              )
              jobs = jobs_payload.get('jobs', [])
              artifacts = artifacts_payload.get('artifacts', [])

              job_lines = []
              for job in jobs:
                  job_lines.append(
                      f"- `{job.get('name')}`: `{job.get('status')}` / "
                      f"`{job.get('conclusion') or 'PENDING'}`"
                  )
              if not job_lines:
                  job_lines.append('- no jobs returned yet')

              artifact_lines = []
              for artifact in artifacts:
                  artifact_lines.append(
                      f"- `{artifact.get('name')}` ({artifact.get('size_in_bytes', 0)} bytes)"
                  )
              if not artifact_lines:
                  artifact_lines.append('- none yet')

              body = '\n'.join([
                  '## A-SCOPE rollout monitor checkpoint',
                  '',
                  f'- observed_at_utc: `{now}`',
                  f"- run_id: `{run_id}`",
                  f"- run_number: `{run.get('run_number')}`",
                  f"- run_attempt: `{run.get('run_attempt')}`",
                  f"- status: `{run.get('status')}`",
                  f"- conclusion: `{run.get('conclusion') or 'PENDING'}`",
                  f"- head_branch: `{run.get('head_branch')}`",
                  f"- head_sha: `{run.get('head_sha')}`",
                  f"- event: `{run.get('event')}`",
                  f"- created_at: `{run.get('created_at')}`",
                  f"- updated_at: `{run.get('updated_at')}`",
                  f"- run_url: {run.get('html_url')}",
                  '',
                  '### Jobs',
                  *job_lines,
                  '',
                  '### Artifacts',
                  *artifact_lines,
                  '',
                  'The monitor is read-only for Actions and did not cancel, rerun, or dispatch any production job.',
              ])

          request_json(
              'POST',
              f'/repos/{repository}/issues/{issue_number}/comments',
              {'body': body},
          )
          print(body)
