name: A-SCOPE F10 Rollout Monitor

on:
  push:
    branches:
      - runtime/ascope-f10-rollout-monitor-20260803
    paths:
      - .github/workflows/ascope-f10-rollout-monitor.yml
      - runtime/ascope-f10-rollout-monitor-trigger.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: ascope-f10-rollout-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect canonical rollout and deferred-recovery issue runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: '71'
          SOURCE_RUN_ID: '30782791016'
          EXPECTED_SOURCE_SHA: a47c6ba5eb5a89a8bbdbf2e0ee58cf247b61b4c3
          PATCH_WORKFLOW: A-SCOPE Deferred Recovery Issue Runner
        shell: python
        run: |
          from __future__ import annotations

          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          api = 'https://api.github.com'
          repository = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ascope-rollout-monitor',
          }

          def get(path: str):
              request = urllib.request.Request(
                  f'{api}{path}', headers=headers, method='GET'
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.loads(response.read().decode('utf-8'))

          def post(path: str, payload: dict):
              request = urllib.request.Request(
                  f'{api}{path}',
                  data=json.dumps(payload).encode('utf-8'),
                  headers=headers,
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.loads(response.read().decode('utf-8'))

          def jobs(run_id: int) -> list[dict]:
              return get(
                  f'/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100'
              ).get('jobs', [])

          source_id = int(os.environ['SOURCE_RUN_ID'])
          source = get(f'/repos/{repository}/actions/runs/{source_id}')
          source_jobs = jobs(source_id)
          source_identity = (
              source.get('name') == 'A-SCOPE F10 Recover B001 and Continue Rollout'
              and source.get('event') == 'push'
              and source.get('head_branch') == 'main'
              and source.get('head_sha') == os.environ['EXPECTED_SOURCE_SHA']
          )

          query = urllib.parse.urlencode({'event': 'issues', 'per_page': 100})
          candidates = get(
              f'/repos/{repository}/actions/runs?{query}'
          ).get('workflow_runs', [])
          patch_runs = [
              item for item in candidates
              if item.get('name') == os.environ['PATCH_WORKFLOW']
          ]
          patch_runs.sort(key=lambda item: item.get('created_at', ''), reverse=True)
          patch = patch_runs[0] if patch_runs else None
          patch_jobs = jobs(int(patch['id'])) if patch else []

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          lines = [
              '## A-SCOPE active execution checkpoint',
              '',
              f'- observed_at_utc: `{now}`',
              f'- canonical_identity_gate: `{"PASS" if source_identity else "FAIL"}`',
              f'- canonical_run: `{source_id}` / `{source.get("status")}` / `{source.get("conclusion") or "PENDING"}`',
              f'- canonical_updated_at: `{source.get("updated_at")}`',
              '',
              '### Canonical jobs',
          ]
          for job in source_jobs:
              active = [
                  step.get('name') for step in (job.get('steps') or [])
                  if step.get('status') == 'in_progress'
              ]
              suffix = f"; active=`{', '.join(active)}`" if active else ''
              lines.append(
                  f"- `{job.get('name')}`: `{job.get('status')}` / "
                  f"`{job.get('conclusion') or 'PENDING'}`{suffix}"
              )

          lines.extend(['', '### Deferred-recovery Issue runner'])
          if patch:
              lines.extend([
                  f'- run_id: `{patch.get("id")}`',
                  f'- status: `{patch.get("status")}`',
                  f'- conclusion: `{patch.get("conclusion") or "PENDING"}`',
                  f'- head_sha: `{patch.get("head_sha")}`',
                  f'- created_at: `{patch.get("created_at")}`',
                  f'- updated_at: `{patch.get("updated_at")}`',
                  f'- run_url: {patch.get("html_url")}',
              ])
              for job in patch_jobs:
                  active = [
                      step.get('name') for step in (job.get('steps') or [])
                      if step.get('status') == 'in_progress'
                  ]
                  suffix = f"; active=`{', '.join(active)}`" if active else ''
                  lines.append(
                      f"- job `{job.get('name')}`: `{job.get('status')}` / "
                      f"`{job.get('conclusion') or 'PENDING'}`{suffix}"
                  )
          else:
              lines.append('- no matching Issue-runner workflow run returned')

          lines.extend([
              '',
              'The monitor was read-only for Actions and did not cancel, rerun, or dispatch any production job.',
          ])
          body = '\n'.join(lines)
          post(
              f'/repos/{repository}/issues/{os.environ["ISSUE_NUMBER"]}/comments',
              {'body': body},
          )
          print(body)
          if not source_identity:
              raise SystemExit('canonical source identity gate failed')
