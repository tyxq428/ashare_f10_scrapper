name: A-SCOPE Finalizer Patch Runner v2

on:
  push:
    branches:
      - main
    paths:
      - .devflow/ascope-finalizer-patch-activation-v2.json

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ascope-finalizer-patch-runner-v2
  cancel-in-progress: false

jobs:
  prepare_patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PATCH_BRANCH: hotfix/ascope-finalizer-variable-batch-size-v2
    steps:
      - name: Check out exact main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact source filter and variable-size batch acceptance
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/ascope-f10-retryable-rollout-recovery.yml')
          text = path.read_text(encoding='utf-8')
          expression_open = '$' + '{{'
          expression_close = '}}'
          final_marker = "expected_input_count = int(recovery_report['verification']['input_count'])"
          if final_marker in text:
              raise SystemExit('target finalizer is already patched')

          old_source = "  source_gate:\n    if: github.event_name != 'pull_request'\n"
          new_source = (
              "  source_gate:\n"
              "    if: >-\n"
              f"      {expression_open}\n"
              "        github.event_name == 'workflow_dispatch'\n"
              "        || (\n"
              "          github.event_name == 'workflow_run'\n"
              "          && github.event.workflow_run.id == 30782791016\n"
              "          && github.event.workflow_run.event == 'push'\n"
              "          && github.event.workflow_run.head_branch == 'main'\n"
              "          && github.event.workflow_run.head_sha == 'a47c6ba5eb5a89a8bbdbf2e0ee58cf247b61b4c3'\n"
              "        )\n"
              f"      {expression_close}\n"
          )

          old_validation = """          validation = json.loads(
              (root / 'validation_report.json').read_text(encoding='utf-8')
          )
          expected = {
              'input_count': 200,
              'successful_count': 200,
              'failed_count': 0,
              'deferred_count': 0,
              'conservation_pass': True,
              'formal_future_rows': 0,
          }
          for key, wanted in expected.items():
              if validation.get(key) != wanted:
                  raise SystemExit(
                      f'corrected batch mismatch: {key}={validation.get(key)!r}, '
                      f'expected={wanted!r}'
                  )
          if validation.get('status') not in {'PASS', 'PASS_WITH_GAPS'}:
              raise SystemExit(f'corrected batch is not acceptable: {validation}')
          checkpoint = json.loads(
              (root / 'checkpoint.json').read_text(encoding='utf-8')
          )
          recovered = [
              item for item in checkpoint['stocks'] if item.get('recovery_history')
          ]
          recovery_report = json.loads(
              (root / 'retryable_recovery_report.json').read_text(encoding='utf-8')
          )
"""
          new_validation = """          validation = json.loads(
              (root / 'validation_report.json').read_text(encoding='utf-8')
          )
          recovery_report = json.loads(
              (root / 'retryable_recovery_report.json').read_text(encoding='utf-8')
          )
          expected_input_count = int(recovery_report['verification']['input_count'])
          expected = {
              'input_count': expected_input_count,
              'successful_count': expected_input_count,
              'failed_count': 0,
              'deferred_count': 0,
              'conservation_pass': True,
              'formal_future_rows': 0,
          }
          for key, wanted in expected.items():
              if validation.get(key) != wanted:
                  raise SystemExit(
                      f'corrected batch mismatch: {key}={validation.get(key)!r}, '
                      f'expected={wanted!r}'
                  )
          if validation.get('status') not in {'PASS', 'PASS_WITH_GAPS'}:
              raise SystemExit(f'corrected batch is not acceptable: {validation}')
          checkpoint = json.loads(
              (root / 'checkpoint.json').read_text(encoding='utf-8')
          )
          recovered = [
              item for item in checkpoint['stocks'] if item.get('recovery_history')
          ]
"""

          old_report = (
              "  report_interruption:\n"
              "    if: >-\n"
              f"      {expression_open}\n"
              "        always()\n"
              "        && github.event_name != 'pull_request'\n"
              "        && needs.reduce_full_market.result != 'success'\n"
              f"      {expression_close}\n"
          )
          new_report = (
              "  report_interruption:\n"
              "    if: >-\n"
              f"      {expression_open}\n"
              "        always()\n"
              "        && github.event_name != 'pull_request'\n"
              "        && needs.source_gate.result != 'skipped'\n"
              "        && needs.reduce_full_market.result != 'success'\n"
              f"      {expression_close}\n"
          )

          anchors = {
              'source gate': old_source in text,
              'variable batch validation': old_validation in text,
              'interruption filter': old_report in text,
          }
          missing = [name for name, present in anchors.items() if not present]
          if missing:
              raise SystemExit(f'patch anchors not found: {missing}')

          text = text.replace(old_source, new_source, 1)
          text = text.replace(old_validation, new_validation, 1)
          text = text.replace(old_report, new_report, 1)
          required = [
              'github.event.workflow_run.id == 30782791016',
              final_marker,
              "'successful_count': expected_input_count",
              "needs.source_gate.result != 'skipped'",
          ]
          absent = [fragment for fragment in required if fragment not in text]
          if absent:
              raise SystemExit(f'patched workflow validation failed: {absent}')
          if "'input_count': 200" in text or "'successful_count': 200" in text:
              raise SystemExit('hard-coded corrected-batch size remains')
          path.write_text(text, encoding='utf-8')

      - name: Create isolated patch branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C "$PATCH_BRANCH"
          git add .github/workflows/ascope-f10-retryable-rollout-recovery.yml
          git commit -m 'Handle variable final batch in A-SCOPE recovery'
          git push --force origin "$PATCH_BRANCH"

          existing="$(gh pr list --repo "$REPOSITORY" --head "$PATCH_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create \
              --repo "$REPOSITORY" \
              --base main \
              --head "$PATCH_BRANCH" \
              --title 'Handle variable B027 size in A-SCOPE finalizer' \
              --body 'Bind the finalizer to canonical source Run 30782791016, derive corrected batch size from verified input so B027 can correctly pass at 131/131, and suppress false interruption comments for skipped source events. This PR dispatches no production batch and uses no Gmail, Codex, paid probes, broad reruns or automatic trading.'
          fi

      - name: Persist safe preparer result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 71 --repo "${{ github.repository }}" --body \
            '## A-SCOPE finalizer variable-batch patch PR prepared

The registered v2 patch runner created or refreshed the isolated finalizer patch branch. The canonical source Run `30782791016` was not cancelled, rerun, or modified. No Gmail connection, Codex, or paid probe was used.'
