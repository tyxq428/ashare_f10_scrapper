name: Prepare A-SCOPE Finalizer B027 Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-ascope-finalizer-b027-fix.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: prepare-ascope-finalizer-b027-fix
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PATCH_BRANCH: hotfix/ascope-finalizer-b027-runtime-patch-v1
    steps:
      - name: Check out exact main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Patch exact-source filtering and variable batch size validation
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/ascope-f10-retryable-rollout-recovery.yml')
          text = path.read_text(encoding='utf-8')
          expression_open = '$' + '{{'
          expression_close = '}}'

          old_source = "  source_gate:\n    if: github.event_name != 'pull_request'\n"
          new_source = (
              "  source_gate:\n"
              "    if: >-\n"
              f"      {expression_open}\n"
              "        github.event_name == 'workflow_dispatch'\n"
              "        || (\n"
              "          github.event_name == 'workflow_run'\n"
              "          && github.event.workflow_run.id == 30782791016\n"
              "          && github.event.workflow_run.event == 'push'\n"
              "          && github.event.workflow_run.head_branch == 'main'\n"
              "          && github.event.workflow_run.head_sha == 'a47c6ba5eb5a89a8bbdbf2e0ee58cf247b61b4c3'\n"
              "        )\n"
              f"      {expression_close}\n"
          )

          old_validation = """          validation = json.loads(
              (root / 'validation_report.json').read_text(encoding='utf-8')
          )
          expected = {
              'input_count': 200,
              'successful_count': 200,
              'failed_count': 0,
              'deferred_count': 0,
              'conservation_pass': True,
              'formal_future_rows': 0,
          }
          for key, wanted in expected.items():
              if validation.get(key) != wanted:
                  raise SystemExit(
                      f'corrected batch mismatch: {key}={validation.get(key)!r}, '
                      f'expected={wanted!r}'
                  )
          if validation.get('status') not in {'PASS', 'PASS_WITH_GAPS'}:
              raise SystemExit(f'corrected batch is not acceptable: {validation}')
          checkpoint = json.loads(
              (root / 'checkpoint.json').read_text(encoding='utf-8')
          )
          recovered = [
              item for item in checkpoint['stocks'] if item.get('recovery_history')
          ]
          recovery_report = json.loads(
              (root / 'retryable_recovery_report.json').read_text(encoding='utf-8')
          )
"""
          new_validation = """          validation = json.loads(
              (root / 'validation_report.json').read_text(encoding='utf-8')
          )
          recovery_report = json.loads(
              (root / 'retryable_recovery_report.json').read_text(encoding='utf-8')
          )
          expected_input_count = int(recovery_report['verification']['input_count'])
          expected = {
              'input_count': expected_input_count,
              'successful_count': expected_input_count,
              'failed_count': 0,
              'deferred_count': 0,
              'conservation_pass': True,
              'formal_future_rows': 0,
          }
          for key, wanted in expected.items():
              if validation.get(key) != wanted:
                  raise SystemExit(
                      f'corrected batch mismatch: {key}={validation.get(key)!r}, '
                      f'expected={wanted!r}'
                  )
          if validation.get('status') not in {'PASS', 'PASS_WITH_GAPS'}:
              raise SystemExit(f'corrected batch is not acceptable: {validation}')
          checkpoint = json.loads(
              (root / 'checkpoint.json').read_text(encoding='utf-8')
          )
          recovered = [
              item for item in checkpoint['stocks'] if item.get('recovery_history')
          ]
"""

          old_report = (
              "  report_interruption:\n"
              "    if: >-\n"
              f"      {expression_open}\n"
              "        always()\n"
              "        && github.event_name != 'pull_request'\n"
              "        && needs.reduce_full_market.result != 'success'\n"
              f"      {expression_close}\n"
          )
          new_report = (
              "  report_interruption:\n"
              "    if: >-\n"
              f"      {expression_open}\n"
              "        always()\n"
              "        && github.event_name != 'pull_request'\n"
              "        && needs.source_gate.result != 'skipped'\n"
              "        && needs.reduce_full_market.result != 'success'\n"
              f"      {expression_close}\n"
          )

          anchors = {
              'source gate': old_source in text,
              'variable batch validation': old_validation in text,
              'interruption filter': old_report in text,
          }
          missing = [name for name, present in anchors.items() if not present]
          if missing:
              raise SystemExit(f'patch anchors not found: {missing}')

          text = text.replace(old_source, new_source, 1)
          text = text.replace(old_validation, new_validation, 1)
          text = text.replace(old_report, new_report, 1)
          path.write_text(text, encoding='utf-8')

      - name: Validate patched workflow fragments
        shell: python
        run: |
          from pathlib import Path

          text = Path('.github/workflows/ascope-f10-retryable-rollout-recovery.yml').read_text(
              encoding='utf-8'
          )
          required = [
              "github.event.workflow_run.id == 30782791016",
              "expected_input_count = int(recovery_report['verification']['input_count'])",
              "'successful_count': expected_input_count",
              "needs.source_gate.result != 'skipped'",
          ]
          missing = [fragment for fragment in required if fragment not in text]
          if missing:
              raise SystemExit(f'patched workflow validation failed: {missing}')
          if "'input_count': 200" in text or "'successful_count': 200" in text:
              raise SystemExit('hard-coded corrected-batch size remains')

      - name: Create isolated patch branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C "$PATCH_BRANCH"
          git add .github/workflows/ascope-f10-retryable-rollout-recovery.yml
          git commit -m 'Handle variable final batch in A-SCOPE recovery'
          git push --force-with-lease origin "$PATCH_BRANCH"

          existing="$(gh pr list --repo "$REPOSITORY" --head "$PATCH_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Patch PR already exists: #$existing"
            exit 0
          fi

          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$PATCH_BRANCH" \
            --title 'Handle variable B027 size in A-SCOPE finalizer' \
            --body 'Fix the post-rollout finalizer before canonical Run 30782791016 completes: accept only the exact source event, derive corrected batch size from the verified request package so B027 can be 131 rather than 200, and suppress false interruption comments for skipped source gates. No production run is dispatched by this PR; no Gmail, Codex, paid probes, broad reruns or automatic trading.'

      - name: Persist preparer result
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import json
          import os
          import urllib.request

          body = '\n'.join([
              '## A-SCOPE finalizer edge-case patch prepared',
              '',
              '- source-event filter: exact canonical Run `30782791016` only;',
              '- corrected-batch size: derived from verified request input, including B027 with fewer than 200 securities;',
              '- skipped source gates: no false interruption comment;',
              '- production source Run `30782791016`: untouched.',
              '',
              'A separate patch PR was opened for normal CI and merge. No Gmail connection was used.',
          ])
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/71/comments",
              data=json.dumps({'body': body}).encode('utf-8'),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'prepare-ascope-finalizer-b027-fix',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              print(response.status)
