name: Patch A-SCOPE Retryable Source Filter

on:
  push:
    branches:
      - hotfix/ascope-retryable-source-filter-v1
    paths:
      - .github/workflows/patch-ascope-retryable-source-filter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out patch branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: hotfix/ascope-retryable-source-filter-v1
          persist-credentials: true

      - name: Apply exact source-run filter and suppress unrelated interruption noise
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/ascope-f10-retryable-rollout-recovery.yml')
          text = path.read_text(encoding='utf-8')
          old_source = """  source_gate:\n    if: github.event_name != 'pull_request'\n"""
          new_source = """  source_gate:\n    if: >-\n      ${{\n        github.event_name == 'workflow_dispatch'\n        || (\n          github.event_name == 'workflow_run'\n          && github.event.workflow_run.id == 30782791016\n          && github.event.workflow_run.event == 'push'\n          && github.event.workflow_run.head_branch == 'main'\n          && github.event.workflow_run.head_sha == 'a47c6ba5eb5a89a8bbdbf2e0ee58cf247b61b4c3'\n        )\n      }}\n"""
          old_report = """  report_interruption:\n    if: >-\n      ${{\n        always()\n        && github.event_name != 'pull_request'\n        && needs.reduce_full_market.result != 'success'\n      }}\n"""
          new_report = """  report_interruption:\n    if: >-\n      ${{\n        always()\n        && github.event_name != 'pull_request'\n        && needs.source_gate.result != 'skipped'\n        && needs.reduce_full_market.result != 'success'\n      }}\n"""
          if old_source not in text:
              raise SystemExit('source_gate anchor not found')
          if old_report not in text:
              raise SystemExit('report_interruption anchor not found')
          text = text.replace(old_source, new_source, 1).replace(old_report, new_report, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit patched workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ascope-f10-retryable-rollout-recovery.yml
          if git diff --cached --quiet; then
            echo 'No workflow patch required.'
            exit 0
          fi
          git commit -m 'Filter A-SCOPE finalizer to exact source rollout'
          git push origin HEAD:hotfix/ascope-retryable-source-filter-v1
