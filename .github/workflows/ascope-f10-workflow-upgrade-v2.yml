name: A-SCOPE F10 Workflow Upgrade v2

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main
    paths:
      - .github/workflows/ascope-f10-workflow-upgrade-v2.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.pull_request.head.ref == 'feature/ascope-f10-export-bridge-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out bridge branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/ascope-f10-export-bridge-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: '3.12'
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Patch rollout-safe artifact and state behavior
        shell: python
        run: |
          from pathlib import Path

          opening = '$' + '{{'
          closing = '}}'
          workflow_path = Path('.github/workflows/ascope-f10-batch-export.yml')
          text = workflow_path.read_text(encoding='utf-8')
          old_env = f'  RESUME_RUN_ID: {opening} inputs.resume_run_id {closing}'
          new_env = f'  RESUME_RUN_ID: {opening} inputs.resume_run_id || github.run_id {closing}'
          text = text.replace(old_env, new_env, 1)
          text = text.replace(
              'echo "artifact_name=ascope-f10-${BATCH_ID}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"',
              'echo "artifact_name=ascope-f10-${BATCH_ID}-s${SMOKE_COUNT}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"',
              1,
          )
          old_name = (
              f'name: ascope-f10-{opening} env.BATCH_ID {closing}-'
              f'{opening} env.RESUME_RUN_ID {closing}'
          )
          new_name = (
              f'name: ascope-f10-{opening} env.BATCH_ID {closing}-s'
              f'{opening} env.SMOKE_COUNT {closing}-{opening} env.RESUME_RUN_ID {closing}'
          )
          text = text.replace(old_name, new_name, 1)
          text = text.replace(
              '          path: 09_OUTPUTS/ascope-f10\n          run-id:',
              '          path: 09_OUTPUTS\n          run-id:',
              1,
          )
          if '        continue-on-error:' not in text:
              marker = "      - name: Restore compatible prior batch artifact\n        if: env.RESUME_RUN_ID != ''\n"
              expression = opening + " inputs.resume_run_id == '' " + closing
              replacement = marker + f'        continue-on-error: {expression}\n'
              if marker not in text:
                  raise SystemExit('restore step marker not found')
              text = text.replace(marker, replacement, 1)
          if '          overwrite: true\n' not in text:
              marker = '          compression-level: 6\n'
              if marker not in text:
                  raise SystemExit('upload marker not found')
              text = text.replace(marker, marker + '          overwrite: true\n', 1)
          workflow_path.write_text(text, encoding='utf-8')

          rollout_path = Path('src/ashare_f10/ascope_bridge/rollout.py')
          rollout = rollout_path.read_text(encoding='utf-8')
          old = '''    if batch_id == "B001":
        if value["phase"] != "B001_SMOKE_PASS":
            raise RolloutError("ROLLOUT_B001_ORDER_VIOLATION", f"phase={value['phase']}")
        value["phase"] = "B001_FULL_RUNNING"
    elif value["phase"] not in {"B001_FULL_PASS", "FULL_ROLLOUT_RUNNING", "FULL_ROLLOUT_PARTIAL"}:
        raise RolloutError("ROLLOUT_FULL_ORDER_VIOLATION", f"phase={value['phase']}")
    active = list(value.get("active_batches") or [])
'''
          new = '''    record = value["batches"].get(batch_id)
    if record is None:
        raise RolloutError("ROLLOUT_UNKNOWN_BATCH", batch_id)
    if record["status"] in SUCCESS_BATCH:
        raise RolloutError("ROLLOUT_SUCCESS_RESTART_FORBIDDEN", batch_id)
    if batch_id == "B001":
        if value["phase"] != "B001_SMOKE_PASS":
            raise RolloutError("ROLLOUT_B001_ORDER_VIOLATION", f"phase={value['phase']}")
        value["phase"] = "B001_FULL_RUNNING"
    elif value["phase"] not in {"B001_FULL_PASS", "FULL_ROLLOUT_RUNNING", "FULL_ROLLOUT_PARTIAL"}:
        raise RolloutError("ROLLOUT_FULL_ORDER_VIOLATION", f"phase={value['phase']}")
    active = list(value.get("active_batches") or [])
'''
          if old in rollout:
              rollout = rollout.replace(old, new, 1)
          duplicate = '''    record = value["batches"][batch_id]
    if record["status"] in SUCCESS_BATCH:
        raise RolloutError("ROLLOUT_SUCCESS_RESTART_FORBIDDEN", batch_id)
'''
          if duplicate in rollout:
              rollout = rollout.replace(duplicate, '', 1)
          rollout_path.write_text(rollout, encoding='utf-8')

      - name: Validate workflow and rollout contracts
        run: |
          ruff check --fix src/ashare_f10/ascope_bridge/rollout.py tests/test_ascope_f10_rollout.py
          ruff check src/ashare_f10/ascope_bridge/rollout.py tests/test_ascope_f10_rollout.py
          python scripts/devflow/validate_workflows.py
          pytest -q tests/test_ascope_f10_rollout.py tests/test_ascope_f10_batch.py tests/test_ascope_f10_reducer.py

      - name: Commit validated change and remove helpers
        run: |
          git rm -f .github/workflows/ascope-f10-workflow-upgrade.yml \
            .github/workflows/ascope-f10-workflow-upgrade-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ascope-f10-batch-export.yml \
            src/ashare_f10/ascope_bridge/rollout.py
          git commit -m 'Make A-SCOPE rollout resumable and ordered'
          git push origin HEAD:feature/ascope-f10-export-bridge-v1
