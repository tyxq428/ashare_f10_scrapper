name: A-SCOPE F10 Bridge Autofix

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main
    paths:
      - .github/workflows/ascope-f10-autofix.yml

permissions:
  contents: write

concurrency:
  group: ascope-f10-autofix
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feature/ascope-f10-export-bridge-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out bridge branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/ascope-f10-export-bridge-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: '3.12'
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Apply deterministic import fix
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'src/ashare_f10/ascope_bridge/batch.py': (
                  'from typing import Any, Callable, Mapping\n',
                  'from collections.abc import Callable, Mapping\nfrom typing import Any\n',
              ),
              'src/ashare_f10/ascope_bridge/reducer.py': (
                  'from typing import Any, Mapping\n',
                  'from collections.abc import Mapping\nfrom typing import Any\n',
              ),
              'src/ashare_f10/ascope_bridge/single_stock.py': (
                  'from typing import Any, Callable, Mapping\n',
                  'from collections.abc import Callable, Mapping\nfrom typing import Any\n',
              ),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected import not found in {filename}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validate bridge implementation
        run: |
          ruff check --fix src/ashare_f10/ascope_bridge/batch.py \
            src/ashare_f10/ascope_bridge/reducer.py \
            src/ashare_f10/ascope_bridge/single_stock.py
          ruff check src/ashare_f10/ascope_bridge tests/test_ascope_f10_*.py
          pytest -q tests/test_ascope_f10_request_package.py \
            tests/test_ascope_f10_finance.py \
            tests/test_ascope_f10_single_stock.py \
            tests/test_ascope_f10_batch.py \
            tests/test_ascope_f10_reducer.py

      - name: Commit validated fix and remove helper workflow
        run: |
          rm .github/workflows/ascope-f10-autofix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ashare_f10/ascope_bridge .github/workflows/ascope-f10-autofix.yml
          git commit -m 'Fix A-SCOPE bridge lint'
          git push origin HEAD:feature/ascope-f10-export-bridge-v1
