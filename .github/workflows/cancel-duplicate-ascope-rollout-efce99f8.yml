name: Cancel Duplicate A-SCOPE Rollout efce99f8

on:
  push:
    branches:
      - runtime/cancel-duplicate-ascope-rollout-efce99f8
    paths:
      - .github/workflows/cancel-duplicate-ascope-rollout-efce99f8.yml

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  cancel_exact_duplicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Find and cancel only the duplicate rollout from hotfix merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DUPLICATE_HEAD_SHA: efce99f80448fe7f4e1521120880a0067d790b2b
          PRESERVE_RUN_ID: '30782791016'
          WORKFLOW_FILE: ascope-f10-b001-recovery.yml
        shell: python
        run: |
          from __future__ import annotations

          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          api = 'https://api.github.com'
          repository = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          duplicate_sha = os.environ['DUPLICATE_HEAD_SHA']
          preserve_run_id = int(os.environ['PRESERVE_RUN_ID'])
          workflow_file = os.environ['WORKFLOW_FILE']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'cancel-duplicate-ascope-rollout',
          }

          def request_json(method: str, path: str, payload: dict | None = None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = urllib.request.Request(
                  f'{api}{path}', data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read()
                  return json.loads(raw.decode('utf-8')) if raw else {}

          query = urllib.parse.urlencode({
              'branch': 'main',
              'event': 'push',
              'per_page': 50,
          })
          runs = request_json(
              'GET',
              f'/repos/{repository}/actions/workflows/{workflow_file}/runs?{query}',
          ).get('workflow_runs', [])
          matches = [
              run
              for run in runs
              if run.get('head_sha') == duplicate_sha
              and int(run.get('id')) != preserve_run_id
          ]
          if len(matches) > 1:
              raise SystemExit(
                  f'more than one duplicate exact-SHA run found: {[run.get("id") for run in matches]}'
              )

          cancelled = []
          for run in matches:
              run_id = int(run['id'])
              status = str(run.get('status') or '')
              if status in {'queued', 'in_progress', 'waiting', 'pending', 'requested'}:
                  request_json(
                      'POST',
                      f'/repos/{repository}/actions/runs/{run_id}/cancel',
                  )
                  cancelled.append(run_id)

          report = {
              'status': 'PASS',
              'observed_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'preserved_source_run_id': preserve_run_id,
              'duplicate_head_sha': duplicate_sha,
              'matching_run_ids': [int(run['id']) for run in matches],
              'cancelled_run_ids': cancelled,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))

          body = '\n'.join([
              '## Duplicate rollout guard — exact hotfix-triggered chain cancelled',
              '',
              f'- preserved source rollout: `{preserve_run_id}`',
              f'- hotfix merge SHA: `{duplicate_sha}`',
              f"- matching duplicate run IDs: `{', '.join(map(str, report['matching_run_ids'])) or 'none'}`",
              f"- cancelled duplicate run IDs: `{', '.join(map(str, cancelled)) or 'none'}`",
              '',
              'The original in-flight rollout was not touched. This guard targets only the exact hotfix merge SHA and does not perform any rerun.',
              '',
              'No Gmail, Codex, paid probes or automatic trading were used.',
          ])
          request_json(
              'POST',
              f'/repos/{repository}/issues/71/comments',
              {'body': body},
          )
