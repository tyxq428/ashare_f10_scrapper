name: A-SCOPE F10 API Wire

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main
    paths:
      - .github/workflows/ascope-f10-api-wire.yml

permissions:
  contents: write

concurrency:
  group: ascope-f10-api-wire
  cancel-in-progress: false

jobs:
  wire:
    if: github.event.pull_request.head.ref == 'feature/ascope-f10-export-bridge-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out bridge branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/ascope-f10-export-bridge-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: '3.12'
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Wire the persisted A-SCOPE router into FastAPI
        shell: python
        run: |
          from pathlib import Path

          app_path = Path('src/ashare_f10/api/app.py')
          text = app_path.read_text(encoding='utf-8')
          import_line = 'from ashare_f10.api.ascope_batches import router as ascope_batches_router\n'
          if import_line not in text:
              marker = 'from ashare_f10.api.jobs_v2 import JobManager\n'
              if marker not in text:
                  raise SystemExit('jobs_v2 import marker not found')
              text = text.replace(marker, import_line + marker, 1)
          include_line = 'app.include_router(ascope_batches_router)\n'
          if include_line not in text:
              marker = 'manager = JobManager(settings)\napp.include_router(cross_validation_router)\n'
              if marker not in text:
                  raise SystemExit('router include marker not found')
              text = text.replace(
                  marker,
                  'manager = JobManager(settings)\n'
                  'app.include_router(ascope_batches_router)\n'
                  'app.include_router(cross_validation_router)\n',
                  1,
              )
          app_path.write_text(text, encoding='utf-8')

          api_path = Path('src/ashare_f10/api/ascope_batches.py')
          api_text = api_path.read_text(encoding='utf-8')
          unused = '            job_dir = self.jobs_dir / job_id\n'
          if unused in api_text:
              api_text = api_text.replace(unused, '', 1)
          api_path.write_text(api_text, encoding='utf-8')

      - name: Validate API manager and route integration
        run: |
          ruff check --fix src/ashare_f10/api/app.py src/ashare_f10/api/ascope_batches.py tests/test_ascope_f10_api.py
          ruff check src/ashare_f10/api/app.py src/ashare_f10/api/ascope_batches.py tests/test_ascope_f10_api.py
          pytest -q tests/test_ascope_f10_api.py tests/test_platform_integration.py

      - name: Commit validated API wiring and remove helper
        run: |
          rm .github/workflows/ascope-f10-api-wire.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ashare_f10/api/app.py src/ashare_f10/api/ascope_batches.py \
            tests/test_ascope_f10_api.py .github/workflows/ascope-f10-api-wire.yml
          git commit -m 'Wire A-SCOPE batch API'
          git push origin HEAD:feature/ascope-f10-export-bridge-v1
