name: A-SCOPE F10 Recover B001 and Continue Rollout

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ascope-f10-b001-recovery.yml
      - src/ashare_f10/export/bundle.py
      - src/ashare_f10/export/excel_sanitizer.py
      - src/ashare_f10/recovery/**
      - tests/test_excel_illegal_character_sanitization.py
      - tests/test_ascope_checkpoint_recovery.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/ascope-f10-b001-recovery.yml
      - src/ashare_f10/export/bundle.py
      - src/ashare_f10/export/excel_sanitizer.py
      - src/ashare_f10/recovery/**
      - tests/test_excel_illegal_character_sanitization.py
      - tests/test_ascope_checkpoint_recovery.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ascope-f10-b001-recovery-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  SOURCE_URL: https://github.com/BullbaseGuy/a-scope-reearch/releases/download/ascope-financial-requests-2026-07-30-v1/ascope-financial-requests-2026-07-30-v1.zip
  AS_OF_DATE: '2026-07-30'
  PRIOR_RUN_ID: '30551430941'
  PRIOR_ARTIFACT: ascope-f10-B001-s0-30551430941
  OUTPUT_ROOT: 09_OUTPUTS/ascope-f10

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Validate deterministic recovery code
        run: |
          ruff check \
            src/ashare_f10/export/bundle.py \
            src/ashare_f10/export/excel_sanitizer.py \
            src/ashare_f10/recovery/ascope_checkpoint.py \
            tests/test_excel_illegal_character_sanitization.py \
            tests/test_ascope_checkpoint_recovery.py
          pytest -q \
            tests/test_excel_illegal_character_sanitization.py \
            tests/test_ascope_checkpoint_recovery.py

  recover_b001:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      batch_exit_code: ${{ steps.execute.outputs.exit_code }}
    steps:
      - name: Check out fixed main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python with dependency cache
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Restore failed B001 checkpoint and completed stock outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.PRIOR_ARTIFACT }}
          path: 09_OUTPUTS
          run-id: ${{ env.PRIOR_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify exact failed set and illegal-character root cause
        shell: python
        run: |
          import json
          import re
          from collections import Counter
          from pathlib import Path

          root = Path('09_OUTPUTS/ascope-f10/B001')
          checkpoint = json.loads((root / 'checkpoint.json').read_text(encoding='utf-8'))
          expected = {
              'SZSE.000032': {'U+0002': 2},
              'SZSE.000403': {'U+0000': 134},
              'SZSE.000552': {'U+0002': 2},
              'SZSE.000593': {'U+0019': 4},
          }
          failed = {
              item['security_id']: item
              for item in checkpoint['stocks']
              if item.get('status') in {'FAILED_TERMINAL', 'BLOCKED'}
          }
          if set(failed) != set(expected):
              raise SystemExit(f'unexpected terminal set: {sorted(failed)}')
          illegal = re.compile(r'[\x00-\x08\x0b\x0c\x0e-\x1f]')
          observed = {}
          for security_id in sorted(expected):
              if failed[security_id].get('error_code') != 'F10_FETCH_FAILED':
                  raise SystemExit(f'unexpected error code for {security_id}: {failed[security_id]}')
              combined_path = root / '_f10_runs' / security_id / 'combined.json'
              combined = json.loads(combined_path.read_text(encoding='utf-8'))
              counts = Counter()

              def visit(value):
                  if isinstance(value, dict):
                      for child in value.values():
                          visit(child)
                  elif isinstance(value, list):
                      for child in value:
                          visit(child)
                  elif isinstance(value, str):
                      counts.update(ord(match.group(0)) for match in illegal.finditer(value))

              visit(combined)
              formatted = {f'U+{codepoint:04X}': count for codepoint, count in sorted(counts.items())}
              if formatted != expected[security_id]:
                  raise SystemExit(
                      f'illegal-character evidence changed for {security_id}: '
                      f'observed={formatted}, expected={expected[security_id]}'
                  )
              observed[security_id] = formatted
          report = {
              'status': 'PASS',
              'prior_run_id': 30551430941,
              'completed_count': sum(
                  item.get('status') in {'COMPLETED', 'COMPLETED_WITH_GAPS'}
                  for item in checkpoint['stocks']
              ),
              'failed_count': len(failed),
              'illegal_character_evidence': observed,
          }
          (root / 'recovery_root_cause.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))

      - name: Reset only the four root-cause-fixed terminal securities
        run: |
          python -m ashare_f10.recovery.ascope_checkpoint \
            09_OUTPUTS/ascope-f10/B001/checkpoint.json \
            --security-id SZSE.000032 \
            --security-id SZSE.000403 \
            --security-id SZSE.000552 \
            --security-id SZSE.000593 \
            --expected-error-code F10_FETCH_FAILED \
            --report 09_OUTPUTS/ascope-f10/B001/recovery_reset_report.json

      - name: Resume B001 and preserve exit code
        id: execute
        shell: bash
        run: |
          set +e
          python -m ashare_f10.ascope_bridge.cli run-batch \
            09_OUTPUTS/ascope-request/request.zip \
            --batch-id B001 \
            --as-of-date "$AS_OF_DATE" \
            --smoke-count 0 \
            --data-root data \
            --output-root "$OUTPUT_ROOT" \
            --stock-workers 2 \
            --max-attempts 2 \
            --soft-deadline-seconds 18000 \
            --heartbeat-seconds 30
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate recovered B001 and production boundary
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('09_OUTPUTS/ascope-f10/B001')
          batch = json.loads((root / 'batch_manifest.json').read_text(encoding='utf-8'))
          validation = json.loads((root / 'validation_report.json').read_text(encoding='utf-8'))
          if batch.get('fixture_mode') or batch.get('non_investment_output'):
              raise SystemExit('recovered B001 contains fixture/non-investment markers')
          expected = {
              'input_count': 200,
              'successful_count': 200,
              'failed_count': 0,
              'deferred_count': 0,
              'conservation_pass': True,
          }
          for key, wanted in expected.items():
              if validation.get(key) != wanted:
                  raise SystemExit(
                      f'recovered B001 mismatch: {key}={validation.get(key)!r}, expected={wanted!r}'
                  )
          if validation.get('status') not in {'PASS', 'PASS_WITH_GAPS'}:
              raise SystemExit(f'recovered B001 status is not acceptable: {validation}')
          checkpoint = json.loads((root / 'checkpoint.json').read_text(encoding='utf-8'))
          retried = {
              item['security_id']: item
              for item in checkpoint['stocks']
              if item.get('recovery_history')
          }
          if set(retried) != {
              'SZSE.000032',
              'SZSE.000403',
              'SZSE.000552',
              'SZSE.000593',
          }:
              raise SystemExit(f'unexpected recovery history: {sorted(retried)}')
          if any(item.get('status') not in {'COMPLETED', 'COMPLETED_WITH_GAPS'} for item in retried.values()):
              raise SystemExit(f'one or more recovered securities did not complete: {retried}')

      - name: Upload corrected B001 output and checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ascope-f10-B001-s0-${{ github.run_id }}
          path: |
            09_OUTPUTS/ascope-request
            09_OUTPUTS/ascope-f10/B001
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: true

      - name: Propagate corrected B001 result after checkpoint upload
        if: always()
        shell: bash
        run: |
          code='${{ steps.execute.outputs.exit_code }}'
          [[ "$code" =~ ^[0-9]+$ ]]
          if [[ "$code" != '0' ]]; then
            echo "Recovered B001 returned exit code $code after checkpoint upload." >&2
            exit "$code"
          fi

  remaining_batches:
    if: github.event_name != 'pull_request' && needs.recover_b001.result == 'success'
    needs:
      - recover_b001
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch_id:
          - B002
          - B003
          - B004
          - B005
          - B006
          - B007
          - B008
          - B009
          - B010
          - B011
          - B012
          - B013
          - B014
          - B015
          - B016
          - B017
          - B018
          - B019
          - B020
          - B021
          - B022
          - B023
          - B024
          - B025
          - B026
          - B027
    uses: ./.github/workflows/ascope-f10-batch-export.yml
    with:
      source_mode: url
      source_url: https://github.com/BullbaseGuy/a-scope-reearch/releases/download/ascope-financial-requests-2026-07-30-v1/ascope-financial-requests-2026-07-30-v1.zip
      batch_id: ${{ matrix.batch_id }}
      as_of_date: '2026-07-30'
      smoke_count: '0'
      resume_run_id: ''
      force_retry: false

  reduce_full_market:
    if: >-
      ${{
        always()
        && github.event_name != 'pull_request'
        && needs.recover_b001.result == 'success'
        && needs.remaining_batches.result == 'success'
      }}
    needs:
      - recover_b001
      - remaining_batches
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Download exact request snapshot
        run: |
          set -euo pipefail
          mkdir -p 09_OUTPUTS/rollout-input
          curl --fail --location --retry 2 --retry-delay 5 \
            --output 09_OUTPUTS/rollout-input/request.zip "$SOURCE_URL"

      - name: Download all successful full-batch artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ascope-f10-B*-s0-${{ github.run_id }}
          path: 09_OUTPUTS
          merge-multiple: true

      - name: Reduce and validate all 27 batches
        run: |
          python -m ashare_f10.ascope_bridge.rollout_cli reduce-full \
            09_OUTPUTS/rollout-input/request.zip \
            09_OUTPUTS/ascope-f10 \
            --output-dir 09_OUTPUTS/ascope-f10-full-market \
            --as-of-date "$AS_OF_DATE"

      - name: Reject fixture contamination and incomplete output
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('09_OUTPUTS/ascope-f10-full-market')
          manifest = json.loads((root / 'bundle_manifest.json').read_text(encoding='utf-8'))
          expected = {
              'status': 'PASS',
              'batch_count': 27,
              'expected_security_count': 5331,
              'completed_security_count': 5331,
          }
          for key, wanted in expected.items():
              if manifest.get(key) != wanted:
                  raise SystemExit(
                      f'full-market mismatch: {key}={manifest.get(key)!r}, expected={wanted!r}'
                  )
          if manifest.get('fixture_mode') or manifest.get('non_investment_output'):
              raise SystemExit('full-market output contains fixture markers')

      - name: Upload validated full-market financial package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ascope-f10-full-market-${{ github.run_id }}
          path: 09_OUTPUTS/ascope-f10-full-market
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
