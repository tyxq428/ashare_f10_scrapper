name: A-SCOPE Deferred Recovery PR Runner

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ascope-deferred-recovery-pr-runner
  cancel-in-progress: false

jobs:
  patch_trigger_pr:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'hotfix/ascope-deferred-time-budget-recovery-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out exact trigger branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch permanent finalizer for audited deadline deferrals
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/ascope-f10-retryable-rollout-recovery.yml')
          text = path.read_text(encoding='utf-8')
          final_marker = "expected_statuses={'DEFERRED_TIME_BUDGET'}"

          if final_marker not in text:
              old_name = (
                  '      - name: Verify HTTP 502 boundary and reset only exact '
                  'retryable securities\n'
              )
              new_name = (
                  '      - name: Verify approved recovery boundaries and reset only '
                  'exact securities\n'
              )
              old_import = """          from ashare_f10.recovery.ascope_transient_batch import (
              verify_transient_quote_502_batch,
          )
"""
              new_import = """          from ashare_f10.recovery.ascope_transient_batch import (
              verify_recoverable_batch,
          )
"""
              old_reset = """          verification = verify_transient_quote_502_batch(root)
          reset = reset_retryable_failures(
              root / 'checkpoint.json',
              security_ids=set(verification['security_ids']),
              expected_error_code='F10_FETCH_FAILED',
              reason=(
                  'verified /api/qt/stock/get union_quote_fields outage; '
                  'HTTP 502 only; post-rollout bounded retry authorized'
              ),
          )
"""
              new_reset = """          verification = verify_recoverable_batch(root)
          resets = {}
          retryable_ids = set(verification['retryable_security_ids'])
          if retryable_ids:
              resets['quote_http_502'] = reset_retryable_failures(
                  root / 'checkpoint.json',
                  security_ids=retryable_ids,
                  expected_error_code='F10_FETCH_FAILED',
                  expected_statuses={'FAILED_RETRYABLE'},
                  reason=(
                      'verified /api/qt/stock/get union_quote_fields outage; '
                      'HTTP 502 only; post-rollout bounded retry authorized'
                  ),
              )
          deferred_ids = set(verification['deferred_security_ids'])
          if deferred_ids:
              resets['soft_deadline'] = reset_retryable_failures(
                  root / 'checkpoint.json',
                  security_ids=deferred_ids,
                  expected_error_code='TIME_BUDGET_REACHED',
                  expected_statuses={'DEFERRED_TIME_BUDGET'},
                  reason=(
                      'verified deterministic soft-deadline deferral; '
                      'post-rollout bounded continuation authorized'
                  ),
              )
          if not resets:
              raise SystemExit('recoverable verifier returned no resettable states')
"""

              anchors = {
                  'step name': old_name in text,
                  'verifier import': old_import in text,
                  'reset block': old_reset in text,
                  'report field': "              'reset': reset,\n" in text,
              }
              missing = [name for name, present in anchors.items() if not present]
              if missing:
                  raise SystemExit(f'workflow patch anchors are missing: {missing}')

              text = text.replace(old_name, new_name, 1)
              text = text.replace(old_import, new_import, 1)
              text = text.replace(old_reset, new_reset, 1)
              text = text.replace(
                  "              'reset': reset,\n",
                  "              'resets': resets,\n",
                  1,
              )

          required = [
              'verify_recoverable_batch',
              "expected_statuses={'FAILED_RETRYABLE'}",
              final_marker,
              "expected_error_code='TIME_BUDGET_REACHED'",
              "'resets': resets",
          ]
          absent = [item for item in required if item not in text]
          if absent:
              raise SystemExit(f'patched workflow validation failed: {absent}')
          if 'verify_transient_quote_502_batch(root)' in text:
              raise SystemExit('old strict-only workflow call remains')

          path.write_text(text, encoding='utf-8')
          Path('.devflow/ascope-deferred-recovery-pr-trigger.json').unlink(
              missing_ok=True
          )

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Validate recovery implementation
        run: |
          ruff check \
            src/ashare_f10/recovery/ascope_transient_batch.py \
            src/ashare_f10/recovery/ascope_retryable_checkpoint.py \
            tests/test_ascope_retryable_rollout_recovery.py
          pytest -q tests/test_ascope_retryable_rollout_recovery.py

      - name: Commit reviewed target changes to the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Deferred recovery patch already present; no commit required.'
            exit 0
          fi
          git commit -m 'Recover audited A-SCOPE soft-deadline deferrals'
          git push origin HEAD:"$HEAD_BRANCH"
