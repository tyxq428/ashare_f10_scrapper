name: A-SCOPE F10 Workflow Upgrade

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main
    paths:
      - .github/workflows/ascope-f10-workflow-upgrade.yml

permissions:
  contents: write

concurrency:
  group: ascope-f10-workflow-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.event.pull_request.head.ref == 'feature/ascope-f10-export-bridge-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out bridge branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/ascope-f10-export-bridge-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: '3.12'
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Upgrade immutable artifact identity and rerun behavior
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/ascope-f10-batch-export.yml')
          text = path.read_text(encoding='utf-8')
          old = 'echo "artifact_name=ascope-f10-${BATCH_ID}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"'
          new = 'echo "artifact_name=ascope-f10-${BATCH_ID}-s${SMOKE_COUNT}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"'
          if old in text:
              text = text.replace(old, new, 1)
          restore_old = 'name: ascope-f10-${{ env.BATCH_ID }}-${{ env.RESUME_RUN_ID }}'
          restore_new = 'name: ascope-f10-${{ env.BATCH_ID }}-s${{ env.SMOKE_COUNT }}-${{ env.RESUME_RUN_ID }}'
          if restore_old in text:
              text = text.replace(restore_old, restore_new, 1)
          marker = '          compression-level: 6\n'
          replacement = '          compression-level: 6\n          overwrite: true\n'
          if '          overwrite: true\n' not in text:
              if marker not in text:
                  raise SystemExit('upload-artifact marker not found')
              text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')

      - name: Validate workflow and fixture contract
        run: |
          python scripts/devflow/validate_workflows.py
          pytest -q tests/test_ascope_f10_rollout.py tests/test_ascope_f10_batch.py tests/test_ascope_f10_reducer.py

      - name: Commit validated upgrade and remove helper
        run: |
          rm .github/workflows/ascope-f10-workflow-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ascope-f10-batch-export.yml \
            .github/workflows/ascope-f10-workflow-upgrade.yml
          git commit -m 'Make A-SCOPE batch artifacts rollout-safe'
          git push origin HEAD:feature/ascope-f10-export-bridge-v1
