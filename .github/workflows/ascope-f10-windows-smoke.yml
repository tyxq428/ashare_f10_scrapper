name: A-SCOPE F10 Windows Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/windows/run_ascope_f10_bridge.ps1
      - .github/workflows/ascope-f10-windows-smoke.yml
      - src/ashare_f10/ascope_bridge/**
      - tests/fixtures/ascope_bridge/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ascope-f10-windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: '3.12'
          cache: pip

      - name: Create project virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e '.[dev]'

      - name: Run B001 five-stock fixture through Windows wrapper
        shell: pwsh
        run: |
          .\scripts\windows\run_ascope_f10_bridge.ps1 `
            -RequestSource '.\tests\fixtures\ascope_bridge' `
            -BatchId B001 `
            -AsOfDate 2026-07-30 `
            -SmokeCount 5 `
            -OutputRoot '09_OUTPUTS\ascope-f10-windows' `
            -FixtureMode

      - name: Inspect persisted checkpoint through Windows wrapper
        shell: pwsh
        run: |
          .\scripts\windows\run_ascope_f10_bridge.ps1 `
            -RequestSource '.\tests\fixtures\ascope_bridge' `
            -BatchId B001 `
            -AsOfDate 2026-07-30 `
            -SmokeCount 5 `
            -OutputRoot '09_OUTPUTS\ascope-f10-windows' `
            -FixtureMode `
            -InspectOnly

      - name: Validate Windows artifact contract
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('09_OUTPUTS/ascope-f10-windows/B001')
          manifest = json.loads((root / 'batch_manifest.json').read_text(encoding='utf-8'))
          validation = json.loads((root / 'validation_report.json').read_text(encoding='utf-8'))
          assert manifest['status'] == 'PASS'
          assert manifest['fixture_mode'] is True
          assert manifest['non_investment_output'] is True
          assert validation['status'] == 'PASS'
          assert validation['input_count'] == 5
          assert validation['successful_count'] == 5
          assert validation['future_rows'] == 0
          assert validation['conservation_pass'] is True

      - name: Upload Windows smoke artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ascope-f10-windows-smoke-${{ github.run_id }}
          path: 09_OUTPUTS/ascope-f10-windows/B001
          if-no-files-found: error
          retention-days: 14
